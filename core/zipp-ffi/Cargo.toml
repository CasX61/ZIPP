[package]
publish = false
name = "zipp-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = "2.0.21"
uniffi = "0.32.2"
zipp-core = { version = "0.1.0", path = "../zipp-core" }

[lib]
name = "zipp_ffi"
# staticlib: wird in die App gelinkt; cdylib: liefert die Metadaten für uniffi-bindgen
crate-type = ["lib", "staticlib", "cdylib"]
