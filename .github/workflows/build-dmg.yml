# Wiederverwendbarer Baustein: baut ZIPP.app und das CLI `zipp` (universal),
# signiert und notarisiert (falls Secrets vorhanden) und lädt beides als Artefakt hoch.
# Wird von nightly.yml und release.yml aufgerufen.
name: DMG bauen

on:
  workflow_call:
    inputs:
      version:
        description: "Versionsnummer (CFBundleShortVersionString), leer = aus project.yml"
        type: string
        default: ""
      dmg-name:
        description: "Dateiname des DMG"
        type: string
        required: true
      cli-name:
        description: "Dateiname des CLI-Archivs (.tar.gz)"
        type: string
        required: true
    secrets:
      DEVELOPER_ID_CERT_P12:
        required: false
      DEVELOPER_ID_CERT_PASSWORD:
        required: false
      DEVELOPER_ID_NAME:
        required: false
      NOTARY_KEY_P8:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER_ID:
        required: false

jobs:
  build:
    runs-on: macos-26
    env:
      HAS_SIGNING: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' && secrets.DEVELOPER_ID_NAME != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target
      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Developer-ID-Zertifikat importieren
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/zipp-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Notarisierungs-Schlüssel ablegen
        if: env.HAS_NOTARY == 'true'
        env:
          KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$KEY_P8" > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: App bauen (Release, universal)
        run: scripts/build-app.sh "${{ inputs.version }}" "${{ github.run_number }}"

      - name: DMG erstellen
        env:
          DEVELOPER_ID: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_NAME || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/make-dmg.sh build/Release/ZIPP.app "build/${{ inputs.dmg-name }}"

      - name: CLI bauen
        env:
          DEVELOPER_ID: ${{ env.HAS_SIGNING == 'true' && secrets.DEVELOPER_ID_NAME || '' }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/build-cli.sh "build/${{ inputs.cli-name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: zipp-dmg
          path: |
            build/${{ inputs.dmg-name }}
            build/${{ inputs.dmg-name }}.sha256
            build/${{ inputs.cli-name }}
            build/${{ inputs.cli-name }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Aufräumen
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/zipp-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
